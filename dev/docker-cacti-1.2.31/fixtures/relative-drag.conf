WIDTH 500
HEIGHT 350
TITLE Relative drag regression map
HTMLSTYLE overlib
KEYPOS DEFAULT 10 10

NODE anchor
	LABEL Anchor
	POSITION 190 190

NODE child
	LABEL Child
	POSITION anchor 90 -45

NODE polar
	LABEL Polar Child
	POSITION anchor 45r80

NODE peer
	LABEL Peer
	POSITION 390 190

LINK anchor-peer
	NODES anchor peer
	BANDWIDTH 100M

LINK anchor-child
	NODES anchor child
	VIA 235 160
	BANDWIDTH 100M

LINK child-peer
	NODES child peer
	VIA 330 145
	BANDWIDTH 100M

LINK polar-peer
	NODES polar peer
	BANDWIDTH 100M
